<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orca-Editorial Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-4xl mx-auto py-10 px-4">
        <h1 class="text-3xl font-bold mb-2">Orca-Editorial Agent</h1>
        <p class="text-gray-600 mb-8">コストを68%削り、品質を極める「完全自律型AI編集部」</p>
        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
            <div class="flex flex-col md:flex-row md:items-center gap-4 mb-4">
                <h2 class="text-xl font-semibold whitespace-nowrap">記事生成・検証</h2>
                <input type="text" id="theme" placeholder="テーマ / プロンプト（例: 2026年の量子コンピューティング市場 ※文字数や指示も追記可）" class="flex-1 border p-2 rounded text-sm">
            </div>
            <div class="flex gap-4 mb-4">
                <select id="step" class="border p-2 rounded bg-white" onchange="updateDefaultModel()">
                    <option value="research" selected>1. リサーチ</option>
                    <option value="writing">2. 構成・執筆</option>
                    <option value="fact_check">3. ファクトチェック</option>
                </select>
                <select id="model" class="border p-2 rounded bg-white text-sm">
                    <!-- JavaScriptで動的に生成されます -->
                </select>
                <button id="exec-btn" onclick="generate()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">実行</button>
                <button id="cancel-btn" onclick="cancelGeneration()" class="hidden bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700">停止</button>
            </div>
            
            <div class="mt-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-gray-700">事前リサーチ結果 / 検証する記事本文（空欄の場合は自動取得します）</label>
                    <label class="cursor-pointer bg-gray-100 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-200 border">
                        📄 ファイルを読み込む (MD/TXT/HTML)
                        <input type="file" id="file-upload" accept=".md,.txt,.html" class="hidden" onchange="handleFileUpload(event)">
                    </label>
                </div>
                <textarea id="custom-context" rows="4" placeholder="ここに独自の調査メモや、外部で作成した記事を貼り付けると、AIがそれを元に執筆や検証を行います。" class="w-full border p-2 rounded text-sm"></textarea>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex-1 md:col-span-2 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold">Agent 実行ログ & 結果</h3>
                <div class="flex items-center gap-2">
                    <button onclick="copyToEditor()" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded text-sm hover:bg-indigo-200 font-semibold">📝 上部エディタに反映して編集</button>
                    <select id="download-format" class="border rounded px-2 py-1 text-sm bg-white">
                        <option value="md">Markdown (.md)</option>
                        <option value="txt">Text (.txt)</option>
                        <option value="html">HTML (.html)</option>
                    </select>
                    <button onclick="downloadFile()" class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700 flex items-center gap-1"><span class="text-lg">💾</span> 保存</button>
                </div>
            </div>
                
                <div class="mb-4">
                    <div class="flex justify-between text-sm mb-1">
                        <span id="agent-status" class="font-semibold text-blue-600">待機中</span>
                        <span id="progress-text" class="text-gray-500">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <div id="output" class="bg-gray-900 text-green-400 p-4 rounded flex-1 min-h-[16rem] overflow-y-auto whitespace-pre-wrap font-mono text-sm leading-relaxed">スタンバイ...</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h3 class="font-semibold mb-2">メタデータ & コスト</h3>
                <div class="text-sm">
                    <p class="mb-2"><strong>使用モデル:</strong> <span id="model-name" class="text-gray-500">-</span></p>
                    <p class="mb-2"><strong>消費トークン:</strong> <span id="tokens" class="text-gray-500">-</span></p>
                    <p class="text-lg font-bold mt-4 text-blue-600">推定コスト: <span id="cost">¥0.00</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lastSuccessfulTheme = "";
        let lastSuccessfulStep = "";
        let abortController = null;

        const modelOptions = {
            research: [
                { value: 'orcarouter/free', label: 'orcarouter/free (高速モデル)' },
                { value: 'orcarouter/auto', label: 'orcarouter/auto (高精度・推論モデル)' },
                { value: 'openai/gpt-4o', label: 'GPT-4o (超高精度・安定)' },
                { value: 'openai/gpt-4o-mini', label: 'GPT-4o-mini (高速・安定)' },
                { value: 'anthropic/claude-3-5-sonnet', label: 'Claude 3.5 Sonnet (最高峰)' },
                { value: 'google/gemini-1.5-pro', label: 'Gemini 1.5 Pro (長文特化)' },
                { value: 'deepseek/deepseek-r1', label: 'DeepSeek-R1 (最強推論・激重)' }
            ],
            writing: [
                { value: 'orcarouter/auto', label: 'orcarouter/auto (高精度・推論モデル)' },
                { value: 'orcarouter/free', label: 'orcarouter/free (高速モデル)' },
                { value: 'openai/gpt-4o', label: 'GPT-4o (超高精度・安定)' },
                { value: 'openai/gpt-4o-mini', label: 'GPT-4o-mini (高速・安定)' },
                { value: 'anthropic/claude-3-5-sonnet', label: 'Claude 3.5 Sonnet (最高峰)' },
                { value: 'google/gemini-1.5-pro', label: 'Gemini 1.5 Pro (長文特化)' },
                { value: 'deepseek/deepseek-r1', label: 'DeepSeek-R1 (最強推論・激重)' }
            ],
            fact_check: [
                { value: 'openai/gpt-4o', label: 'GPT-4o (超高精度・安定)' },
                { value: 'anthropic/claude-3-5-sonnet', label: 'Claude 3.5 Sonnet (最高峰)' },
                { value: 'google/gemini-1.5-pro', label: 'Gemini 1.5 Pro (長文特化)' },
                { value: 'openai/gpt-4o-mini', label: 'GPT-4o-mini (高速・安定)' },
                { value: 'deepseek/deepseek-r1', label: 'DeepSeek-R1 (最強推論・激重)' }
            ]
        };

        function updateDefaultModel() {
            const step = document.getElementById('step').value;
            const modelSelect = document.getElementById('model');
            
            // 現在の選択を保存
            const currentSelection = modelSelect.value;
            
            // オプションをクリア
            modelSelect.innerHTML = '';
            
            // 新しいオプションを追加
            const options = modelOptions[step];
            options.forEach(opt => {
                const optionEl = document.createElement('option');
                optionEl.value = opt.value;
                optionEl.textContent = opt.label;
                modelSelect.appendChild(optionEl);
            });
            
            // デフォルトはリストの先頭（キーの並び順でトップにあるもの）が自動選択される
        }

        // 初期ロード時にモデルリストを生成
        window.addEventListener('DOMContentLoaded', () => {
            updateDefaultModel();
        });

        function copyToEditor() {
            const outputEl = document.getElementById('output');
            const customContext = document.getElementById('custom-context');
            
            let text = outputEl.textContent;
            const marker = "---";
            if (text.includes(marker)) {
                text = text.substring(text.indexOf(marker) + marker.length).trim();
            }
            
            if (text && !text.includes('スタンバイ...')) {
                customContext.value = text;
                alert('上部のテキストエリアに結果を反映しました。内容を編集してから次のステップを実行してください。');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert('反映するテキストがありません。');
            }
        }

        function cancelGeneration() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('custom-context').value = e.target.result;
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function downloadFile() {
            const format = document.getElementById('download-format').value;
            const outputEl = document.getElementById('output');
            let text = outputEl.textContent;

            if (!text || text.includes('スタンバイ...')) {
                return alert('保存する結果がありません。');
            }

            let blob;
            let filename = 'result';
            
            if (format === 'md') {
                blob = new Blob([text], { type: 'text/markdown' });
                filename += '.md';
            } else if (format === 'txt') {
                blob = new Blob([text], { type: 'text/plain' });
                filename += '.txt';
            } else if (format === 'html') {
                const htmlContent = marked.parse(text, { gfm: true, breaks: true });
                const fullHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>出力結果</title><style>
                    body { font-family: sans-serif; line-height: 1.6; padding: 2rem; max-width: 900px; margin: auto; }
                    h1, h2, h3 { border-bottom: 1px solid #ccc; padding-bottom: 0.5rem; margin-top: 2rem; }
                    table { border-collapse: collapse; width: 100%; margin: 1.5rem 0; font-size: 0.95rem; }
                    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
                    th { background-color: #f8f9fa; font-weight: bold; }
                    code { background: #f4f4f4; padding: 2px 5px; border-radius: 4px; }
                    pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
                </style></head><body>${htmlContent}</body></html>`;
                blob = new Blob([fullHtml], { type: 'text/html' });
                filename += '.html';
            }
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function generate() {
            let theme = document.getElementById('theme').value;
            const step = document.getElementById('step').value;
            const model = document.getElementById('model').value;
            const outputEl = document.getElementById('output');
            const customContext = document.getElementById('custom-context').value;
            
            let articleText = customContext;
            
            if (!theme) {
                if (step === 'research' || (step === 'writing' && !articleText.trim())) {
                    return alert('新規で検索・作成を行う場合は、テーマを入力してください。');
                } else {
                    theme = "指定なし（記事本文・テキストに基づく）";
                }
            }
            
            // 直前のステップがリサーチで、同じテーマのまま執筆に進む場合、自動でリサーチ結果を引き継ぐ
            if (step === 'writing' && lastSuccessfulStep === 'research' && theme === lastSuccessfulTheme) {
                if (!articleText.trim()) {
                    let prevOutput = outputEl.textContent;
                    const marker = "---";
                    if (prevOutput.includes(marker)) {
                        prevOutput = prevOutput.substring(prevOutput.indexOf(marker) + marker.length).trim();
                    }
                    if (prevOutput && !prevOutput.includes('スタンバイ...')) {
                        articleText = prevOutput;
                    }
                }
            }
            
            if (step === 'fact_check') {
                if (!articleText.trim()) {
                    let prevOutput = outputEl.textContent;
                    const marker = "---";
                    if (prevOutput.includes(marker)) {
                        prevOutput = prevOutput.substring(prevOutput.indexOf(marker) + marker.length).trim();
                    }
                    articleText = prevOutput;
                }
                
                if (!articleText || articleText.includes('スタンバイ...')) {
                    return alert('検証する記事をテキストエリアに入力するか、ファイルで読み込んでください。（または先に「構成・執筆」を実行してください）');
                }
            }
            
            const statusEl = document.getElementById('agent-status');
            const progressTextEl = document.getElementById('progress-text');
            const progressBarEl = document.getElementById('progress-bar');
            
            statusEl.textContent = '初期化中...';
            progressBarEl.style.width = '10%';
            progressTextEl.textContent = '10%';
            outputEl.textContent = '';
            document.getElementById('model-name').textContent = '-';
            document.getElementById('tokens').textContent = '-';
            document.getElementById('cost').textContent = '¥0.00';
            
            document.getElementById('exec-btn').classList.add('hidden');
            document.getElementById('cancel-btn').classList.remove('hidden');
            
            abortController = new AbortController();
            
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({theme: theme, step: step, article: articleText, model: model}),
                    signal: abortController.signal
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (value) {
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n");
                        buffer = lines.pop(); // 最後の不完全な行をバッファに残す
                        
                        for (const line of lines) {
                            if (!line.trim()) continue;
                            const data = JSON.parse(line);
                            processData(data);
                        }
                    }
                    
                    if (done) {
                        if (buffer.trim()) {
                            try {
                                const data = JSON.parse(buffer);
                                processData(data);
                            } catch(e) {}
                        }
                        break;
                    }
                }
                
                function processData(data) {
                    if (data.type === 'status') {
                        statusEl.textContent = data.message;
                        progressBarEl.style.width = data.progress + '%';
                        progressTextEl.textContent = data.progress + '%';
                    } else if (data.type === 'chunk') {
                        outputEl.textContent += data.content;
                        outputEl.scrollTop = outputEl.scrollHeight;
                    } else if (data.type === 'done') {
                        document.getElementById('model-name').textContent = data.actual_model;
                        document.getElementById('tokens').textContent = data.tokens + ' (概算)';
                        document.getElementById('cost').textContent = `¥${data.cost_estimate_jpy}`;
                        statusEl.textContent = '完了';
                        progressBarEl.style.width = '100%';
                        progressTextEl.textContent = '100%';
                        lastSuccessfulTheme = theme;
                        lastSuccessfulStep = step;
                    } else if (data.type === 'error') {
                        statusEl.textContent = 'エラー発生';
                        outputEl.textContent += '\n\nエラー: ' + data.message;
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    statusEl.textContent = 'キャンセルされました';
                    outputEl.textContent += '\n\n⚠️ ユーザーによって処理がキャンセルされました。';
                    progressBarEl.style.width = '0%';
                } else {
                    statusEl.textContent = '通信エラー';
                    outputEl.textContent = '通信エラーが発生しました: ' + err;
                }
            } finally {
                document.getElementById('exec-btn').classList.remove('hidden');
                document.getElementById('cancel-btn').classList.add('hidden');
                abortController = null;
            }
        }
    </script>
</body>
</html>
