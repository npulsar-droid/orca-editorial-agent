<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orca-Editorial Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-4xl mx-auto py-10 px-4">
        <h1 class="text-3xl font-bold mb-2">Orca-Editorial Agent</h1>
        <p class="text-gray-600 mb-8">コストを68%削り、品質を極める「完全自律型AI編集部」</p>
        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
            <h2 class="text-xl font-semibold mb-4">記事生成・検証</h2>
            <div class="flex gap-4 mb-4">
                <input type="text" id="theme" placeholder="テーマ（例: 2026年の量子コンピュータ市場）※新規作成時は必須" class="flex-1 border p-2 rounded">
                <select id="step" class="border p-2 rounded bg-white">
                    <option value="research">リサーチ (orcarouter/free)</option>
                    <option value="writing" selected>構成・執筆 (orcarouter/auto)</option>
                    <option value="fact_check">ファクトチェック (orcarouter/auto)</option>
                </select>
                <button id="exec-btn" onclick="generate()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">実行</button>
                <button id="cancel-btn" onclick="cancelGeneration()" class="hidden bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700">停止</button>
            </div>
            
            <div class="mt-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-gray-700">事前リサーチ結果 / 検証する記事本文（空欄の場合は自動取得します）</label>
                    <label class="cursor-pointer bg-gray-100 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-200 border">
                        📄 ファイルを読み込む (MD/TXT/HTML)
                        <input type="file" id="file-upload" accept=".md,.txt,.html" class="hidden" onchange="handleFileUpload(event)">
                    </label>
                </div>
                <textarea id="custom-context" rows="4" placeholder="ここに独自の調査メモや、外部で作成した記事を貼り付けると、AIがそれを元に執筆や検証を行います。" class="w-full border p-2 rounded text-sm"></textarea>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold">Agent 実行ログ & 結果</h3>
                    <div class="flex items-center gap-2">
                        <select id="download-format" class="border rounded px-2 py-1 text-sm bg-white">
                            <option value="md">Markdown (.md)</option>
                            <option value="txt">テキスト (.txt)</option>
                            <option value="html">HTML (.html)</option>
                        </select>
                        <button onclick="downloadFile()" class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">💾 保存</button>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="flex justify-between text-sm mb-1">
                        <span id="agent-status" class="font-semibold text-blue-600">待機中</span>
                        <span id="progress-text" class="text-gray-500">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <div id="output" class="bg-gray-900 text-green-400 p-4 rounded flex-1 min-h-[16rem] overflow-y-auto whitespace-pre-wrap font-mono text-sm leading-relaxed">スタンバイ...</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h3 class="font-semibold mb-2">メタデータ & コスト</h3>
                <div class="text-sm">
                    <p class="mb-2"><strong>使用モデル:</strong> <span id="model-name" class="text-gray-500">-</span></p>
                    <p class="mb-2"><strong>消費トークン:</strong> <span id="tokens" class="text-gray-500">-</span></p>
                    <p class="text-lg font-bold mt-4 text-blue-600">推定コスト: <span id="cost">¥0.00</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lastSuccessfulTheme = "";
        let lastSuccessfulStep = "";
        let abortController = null;

        function cancelGeneration() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('custom-context').value = e.target.result;
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function downloadFile() {
            const content = document.getElementById('output').textContent;
            if (!content || content.includes('スタンバイ...')) {
                return alert('保存する結果がありません。');
            }
            
            let cleanContent = content;
            const marker = "---";
            if (content.includes(marker)) {
                cleanContent = content.substring(content.indexOf(marker) + marker.length).trim();
            }

            const theme = document.getElementById('theme').value || 'article';
            const step = document.getElementById('step').value;
            const format = document.getElementById('download-format').value;
            const filename = `${theme}_${step}.${format}`;

            let finalContent = cleanContent;
            let mimeType = 'text/plain;charset=utf-8;';

            if (format === 'md') {
                mimeType = 'text/markdown;charset=utf-8;';
            } else if (format === 'html') {
                mimeType = 'text/html;charset=utf-8;';
                const htmlBody = marked.parse(cleanContent);
                finalContent = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${theme}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 2rem; color: #333; }
  h1, h2, h3 { color: #111; margin-top: 2rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
  pre, code { background: #f4f4f4; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; }
  pre { padding: 1rem; overflow-x: auto; }
  pre code { background: transparent; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background-color: #f8f9fa; }
  blockquote { border-left: 4px solid #ddd; margin: 0; padding-left: 1rem; color: #666; }
</style>
</head>
<body>
${htmlBody}
</body>
</html>`;
            }

            const blob = new Blob([finalContent], { type: mimeType });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function generate() {
            let theme = document.getElementById('theme').value;
            const step = document.getElementById('step').value;
            const outputEl = document.getElementById('output');
            const customContext = document.getElementById('custom-context').value;
            
            let articleText = customContext;
            
            if (!theme) {
                if (step === 'research' || (step === 'writing' && !articleText.trim())) {
                    return alert('新規で検索・作成を行う場合は、テーマを入力してください。');
                } else {
                    theme = "指定なし（記事本文・テキストに基づく）";
                }
            }
            
            // 直前のステップがリサーチで、同じテーマのまま執筆に進む場合、自動でリサーチ結果を引き継ぐ
            if (step === 'writing' && lastSuccessfulStep === 'research' && theme === lastSuccessfulTheme) {
                if (!articleText.trim()) {
                    let prevOutput = outputEl.textContent;
                    const marker = "---";
                    if (prevOutput.includes(marker)) {
                        prevOutput = prevOutput.substring(prevOutput.indexOf(marker) + marker.length).trim();
                    }
                    if (prevOutput && !prevOutput.includes('スタンバイ...')) {
                        articleText = prevOutput;
                    }
                }
            }
            
            if (step === 'fact_check') {
                if (!articleText.trim()) {
                    let prevOutput = outputEl.textContent;
                    const marker = "---";
                    if (prevOutput.includes(marker)) {
                        prevOutput = prevOutput.substring(prevOutput.indexOf(marker) + marker.length).trim();
                    }
                    articleText = prevOutput;
                }
                
                if (!articleText || articleText.includes('スタンバイ...')) {
                    return alert('検証する記事をテキストエリアに入力するか、ファイルで読み込んでください。（または先に「構成・執筆」を実行してください）');
                }
            }
            
            const statusEl = document.getElementById('agent-status');
            const progressTextEl = document.getElementById('progress-text');
            const progressBarEl = document.getElementById('progress-bar');
            
            statusEl.textContent = '初期化中...';
            progressBarEl.style.width = '10%';
            progressTextEl.textContent = '10%';
            outputEl.textContent = '';
            
            document.getElementById('exec-btn').classList.add('hidden');
            document.getElementById('cancel-btn').classList.remove('hidden');
            
            abortController = new AbortController();
            
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({theme: theme, step: step, article: articleText}),
                    signal: abortController.signal
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();
                    
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        const data = JSON.parse(line);
                        
                        if (data.type === 'status') {
                            statusEl.textContent = data.message;
                            progressBarEl.style.width = data.progress + '%';
                            progressTextEl.textContent = data.progress + '%';
                        } else if (data.type === 'chunk') {
                            outputEl.textContent += data.content;
                            outputEl.scrollTop = outputEl.scrollHeight;
                        } else if (data.type === 'done') {
                            document.getElementById('model-name').textContent = data.actual_model;
                            document.getElementById('tokens').textContent = data.tokens + ' (概算)';
                            document.getElementById('cost').textContent = `¥${data.cost_estimate_jpy}`;
                            // 成功時に状態を保存（次のステップへの自動引き継ぎ用）
                            lastSuccessfulTheme = theme;
                            lastSuccessfulStep = step;
                        } else if (data.type === 'error') {
                            statusEl.textContent = 'エラー発生';
                            outputEl.textContent += '\n\nエラー: ' + data.message;
                        }
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    statusEl.textContent = 'キャンセルされました';
                    outputEl.textContent += '\n\n⚠️ ユーザーによって処理がキャンセルされました。';
                    progressBarEl.style.width = '0%';
                } else {
                    statusEl.textContent = '通信エラー';
                    outputEl.textContent = '通信エラーが発生しました: ' + err;
                }
            } finally {
                document.getElementById('exec-btn').classList.remove('hidden');
                document.getElementById('cancel-btn').classList.add('hidden');
                abortController = null;
            }
        }
    </script>
</body>
</html>
